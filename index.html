<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spin Art — Tekenschijf</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#151a22;color:#f5f6f8;font:16px system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}h1{margin:0 0 5px;font-size:1.65rem}.sub{color:#b9c0cc;margin:0 0 18px}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#222a35;padding:14px;border-radius:15px;margin-bottom:14px}.control{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=range]{width:180px;accent-color:#6dc6d7}input[type=color]{width:44px;height:35px;border:0;background:none}button{background:#3c5368;color:white;border:1px solid #72859a;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer}button:hover{background:#4a667d}.stage{display:grid;place-items:center;background:#0d1118;border-radius:20px;padding:16px;min-height:300px}canvas{display:block;width:min(100%,720px);height:auto;aspect-ratio:1;touch-action:none;cursor:crosshair}.hint{font-size:.9rem;color:#b9c0cc;margin-top:12px}</style></head><body><main class="wrap"><h1>Spin Art · Draaiende tekenschijf</h1><p class="sub">Teken terwijl de schijf ronddraait.</p><section class="controls"><label class="control">Snelheid <input id="speed" type="range" min="-180" max="180" value="35" step="1"><output id="speedOut">35</output> °/s</label><label class="control">Kleur <input id="color" type="color" value="#e23b64"></label><label class="control">Penseel <input id="brush" type="range" min="1" max="32" value="5"><output id="brushOut">5</output></label><button id="pause">Pauze</button><button id="clear">Nieuwe schijf</button></section><div class="stage"><canvas id="view" width="900" height="900" aria-label="Draaiende tekenschijf waarop je kunt tekenen"></canvas></div><p class="hint">Tip: een positieve snelheid draait rechtsom, een negatieve linksom. Bij 0 staat de schijf stil.</p></main><script>
const view=document.getElementById('view'),ctx=view.getContext('2d');const disk=document.createElement('canvas');disk.width=disk.height=900;const dc=disk.getContext('2d');const cx=450,cy=450,r=420;let angle=0,velocity=35,paused=false,drawing=false,last=null,previousTime=null;
const speed=document.getElementById('speed'),speedOut=document.getElementById('speedOut'),brush=document.getElementById('brush'),brushOut=document.getElementById('brushOut'),color=document.getElementById('color');
function resetDisk(){dc.clearRect(0,0,900,900);dc.save();dc.beginPath();dc.arc(cx,cy,r,0,Math.PI*2);dc.fillStyle='#fff';dc.fill();dc.restore();}resetDisk();
function point(evt){const rect=view.getBoundingClientRect();const sx=(evt.clientX-rect.left)*view.width/rect.width-cx,sy=(evt.clientY-rect.top)*view.height/rect.height-cy;const ca=Math.cos(angle),sa=Math.sin(angle);const x=sx*ca+sy*sa,y=-sx*sa+sy*ca;return {x:x+cx,y:y+cy,inside:x*x+y*y<=r*r};}
function dab(p,prev){dc.save();dc.beginPath();dc.arc(cx,cy,r,0,Math.PI*2);dc.clip();dc.strokeStyle=color.value;dc.fillStyle=color.value;dc.lineWidth=+brush.value;dc.lineCap='round';dc.lineJoin='round';if(prev){dc.beginPath();dc.moveTo(prev.x,prev.y);dc.lineTo(p.x,p.y);dc.stroke();}else{dc.beginPath();dc.arc(p.x,p.y,+brush.value/2,0,Math.PI*2);dc.fill();}dc.restore();}
view.addEventListener('pointerdown',e=>{const p=point(e);if(!p.inside)return;drawing=true;last=p;view.setPointerCapture(e.pointerId);dab(p,null);});view.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);dab(p,last);last=p;});function stop(){drawing=false;last=null;}view.addEventListener('pointerup',stop);view.addEventListener('pointercancel',stop);view.addEventListener('lostpointercapture',stop);
speed.addEventListener('input',()=>{velocity=+speed.value;speedOut.textContent=velocity;});brush.addEventListener('input',()=>brushOut.textContent=brush.value);document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'Verder':'Pauze';});document.getElementById('clear').addEventListener('click',resetDisk);
function frame(time){if(previousTime!==null&&!paused){const dt=Math.min((time-previousTime)/1000,.05);angle+=velocity*Math.PI/180*dt;}previousTime=time;ctx.clearRect(0,0,900,900);ctx.save();ctx.translate(cx,cy);ctx.beginPath();ctx.arc(0,0,r+8,0,Math.PI*2);ctx.fillStyle='#65707d';ctx.fill();ctx.rotate(angle);ctx.drawImage(disk,-cx,-cy);ctx.restore();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
