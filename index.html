const exampleImages=exampleSources.map(src=>{const img=new Image();img.src=src;return img;});
let exampleIndex=-1;
function showExample(){
 exampleIndex=(exampleIndex+1)%exampleImages.length;
 const img=exampleImages[exampleIndex];
 const render=()=>{resetDisk();dc.save();dc.beginPath();dc.arc(cx,cy,r,0,Math.PI*2);dc.clip();dc.drawImage(img,cx-r,cy-r,2*r,2*r);dc.restore();};
 if(img.complete&&img.naturalWidth)render();else img.onload=render;
 document.getElementById('example').textContent='Voorbeelden ('+(exampleIndex+1)+'/5)';
}
document.getElementById('example').addEventListener('click',showExample);
function point(evt){const rect=view.getBoundingClientRect();const sx=(evt.clientX-rect.left)*view.width/rect.width-cx,sy=(evt.clientY-rect.top)*view.height/rect.height-cy;const ca=Math.cos(angle),sa=Math.sin(angle);const x=sx*ca+sy*sa,y=-sx*sa+sy*ca;return {x:x+cx,y:y+cy,inside:x*x+y*y<=r*r};}
function dab(p,prev){dc.save();dc.beginPath();dc.arc(cx,cy,r,0,Math.PI*2);dc.clip();dc.strokeStyle=color.value;dc.fillStyle=color.value;dc.lineWidth=+brush.value;dc.lineCap='round';dc.lineJoin='round';if(prev){dc.beginPath();dc.moveTo(prev.x,prev.y);dc.lineTo(p.x,p.y);dc.stroke();}else{dc.beginPath();dc.arc(p.x,p.y,+brush.value/2,0,Math.PI*2);dc.fill();}dc.restore();}
view.addEventListener('pointerdown',e=>{const p=point(e);if(!p.inside)return;drawing=true;last=p;view.setPointerCapture(e.pointerId);dab(p,null);});view.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);dab(p,last);last=p;});function stop(){drawing=false;last=null;}view.addEventListener('pointerup',stop);view.addEventListener('pointercancel',stop);view.addEventListener('lostpointercapture',stop);
speed.addEventListener('input',()=>{velocity=+speed.value*6;speedOut.textContent=(+speed.value).toFixed(1);});brush.addEventListener('input',()=>brushOut.textContent=brush.value);document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'Verder':'Pauze';});document.getElementById('clear').addEventListener('click',resetDisk);
function frame(time){if(previousTime!==null&&!paused){const dt=Math.min((time-previousTime)/1000,.05);angle+=velocity*Math.PI/180*dt;}previousTime=time;ctx.clearRect(0,0,900,900);ctx.save();ctx.translate(cx,cy);ctx.beginPath();ctx.arc(0,0,r+8,0,Math.PI*2);ctx.fillStyle='#65707d';ctx.fill();ctx.rotate(angle);ctx.drawImage(disk,-cx,-cy);ctx.restore();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
